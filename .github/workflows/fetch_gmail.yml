name: Fetch Gmail

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'
permissions:
  contents: read
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Fetch Gmail
        uses: some-gmail-fetch-action@latest

      - name: Commit and Push
        run: |
          git config --local user.email 'your-email@example.com'
          git config --local user.name 'GitHub Actions'
          git add .
          git commit -m 'Automated Gmail fetch' || echo 'No changes to commit'
          git push
